general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
#
# No on-resume here on purpose: mapping the fullscreen screensaver window
# puts it under the (stationary) cursor, which fires a pointer "enter" on
# it. Hyprland's ext-idle-notify counts that as activity even though the
# cursor never actually moved (cursor:no_warps doesn't help here - that
# only stops explicit warps, not enter/leave from a window appearing under
# a still cursor). With on-resume wired up, hypridle saw an immediate
# false "Resumed" and killed the screensaver within ~1s of it appearing,
# every time. Real dismissal is handled by sgc-launch-screensaver itself
# (exact cursor-position diff, immune to enter/leave) and by mpv's own
# key/click/scroll bindings (mpv-input.conf) - see that script.
listener {
    timeout = 150
    on-timeout = pidof hyprlock || sgc-launch-screensaver
}

# Lock system after 5 minutes
listener {
    timeout = 300
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}
