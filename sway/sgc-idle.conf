# Add the `timeout 150 ...` clause below into your own `swayidle -w exec`
# line in ~/.config/sway/config (swayidle only makes sense as a single
# process with multiple timeout/resume/before-sleep clauses, so this can't
# be a separate standalone `exec` — merge it into whatever swayidle
# invocation you already have).
#
# Full example, including other unrelated timeouts (lock, DPMS off) this
# author also has wired to the same swayidle instance:
#
# exec swayidle -w \
#     timeout 150 'sgc-launch-screensaver' resume 'sgc-kill-screensaver' \
#     timeout 300 'sgc-kill-screensaver; swaylock -f' \
#     timeout 600 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"' \
#     before-sleep 'sgc-kill-screensaver; swaylock -f'

# Elsewhere in your sway config (order doesn't matter):
for_window [app_id="org.sgc.screensaver"] fullscreen enable, border none
